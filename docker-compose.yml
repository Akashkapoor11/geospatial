services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: geospatial
      POSTGRES_USER: geospatial
      POSTGRES_PASSWORD: geospatial
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geospatial -d geospatial"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build: .
    environment:
      APP_NAME: Geospatial File Measurement API
      ENVIRONMENT: docker
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql+psycopg://geospatial:geospatial@db:5432/geospatial
      STORAGE_ROOT: /app/storage
      MAX_UPLOAD_SIZE_MB: 50
      MAX_ZIP_ENTRIES: 1000
      MAX_ZIP_UNCOMPRESSED_MB: 250
      CORS_ALLOWED_ORIGINS: "*"
      AUTO_CREATE_DB: "false"
    ports:
      - "8000:8000"
    volumes:
      - ./storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  postgres_data:
